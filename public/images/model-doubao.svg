<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" role="img" aria-label="豆包 app icon card">
  <defs>
    <linearGradient id="model-doubao-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eafdff"/>
      <stop offset="0.52" stop-color="#52d6ef"/>
      <stop offset="1" stop-color="#0a5e92"/>
    </linearGradient>
    <filter id="model-doubao-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#053052" flood-opacity="0.36"/>
